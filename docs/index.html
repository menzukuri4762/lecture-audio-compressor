<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>講義音声 AI最適化コンプレッサー (スマホ版)</title>
  <meta name="description" content="大学の講義録音をスマホ単体で100MB未満のAI向け高音質MP3に圧縮する完全クライアントサイドWebツール">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#0b0f19">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 29, 47, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --accent-gradient: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      --success: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
      margin-bottom: 32px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    /* Drop / File Selector Zone */
    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(15, 23, 42, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .drop-zone:hover, .drop-zone:active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.08);
    }

    .drop-icon {
      font-size: 36px;
    }

    .drop-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .drop-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    #fileInput {
      display: none;
    }

    /* Selected File Info Card */
    .file-card {
      display: none;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 12px;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      color: #bfdbfe;
    }

    .file-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .meta-val {
      color: var(--text-main);
      font-weight: 500;
    }

    /* Settings */
    .settings-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .pill-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .pill-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: var(--text-sub);
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      color: #93c5fd;
    }

    .btn-preset {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: var(--text-sub);
      padding: 5px 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn-preset:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }

    .btn-preset:active {
      transform: scale(0.97);
    }

    .pill-sub {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pill-btn.active .pill-sub {
      color: #bfdbfe;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
      color: var(--text-sub);
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      transition: .3s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .3s;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Action Button */
    .btn-main {
      width: 100%;
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-main:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-main:active:not(:disabled) {
      transform: scale(0.98);
      filter: brightness(0.95);
    }

    /* Progress & Status */
    .progress-container {
      display: none;
      margin-top: 14px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 50%, #3b82f6 100%);
      background-size: 200% 100%;
      border-radius: 999px;
      transition: width 0.15s ease;
      animation: progress-shimmer 2s infinite linear;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    @keyframes progress-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .status-text {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 22px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(59, 130, 246, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Result Actions */
    .result-container {
      display: none;
      margin-top: 14px;
      gap: 10px;
      flex-direction: column;
    }

    .btn-download {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-share {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Trimming Section */
    .trim-card {
      margin-top: 10px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      display: none;
    }

    .trim-time-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .trim-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .trim-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .trim-input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .trim-input {
      width: 76px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      padding: 5px 2px;
      outline: none;
    }

    .trim-input:focus {
      border-color: var(--primary);
    }

    .btn-micro {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 600;
      padding: 5px 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-micro:hover {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border-color: var(--primary);
    }

    .trim-duration-badge {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .range-slider-container {
      position: relative;
      height: 36px;
      display: flex;
      align-items: center;
      margin: 8px 0;
    }

    .range-track {
      position: absolute;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .range-highlight {
      position: absolute;
      height: 8px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 4px;
      left: 0%;
      width: 100%;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    .trim-slider {
      position: absolute;
      width: 100%;
      margin: 0;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      outline: none;
    }

    .trim-slider::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #3b82f6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .trim-slider::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }

    .trim-slider::-moz-range-thumb {
      pointer-events: auto;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #3b82f6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-preview {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid var(--primary);
      color: #93c5fd;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-preview:hover {
      background: rgba(59, 130, 246, 0.35);
      color: #ffffff;
    }

    .btn-preview:active {
      transform: scale(0.96);
    }

    /* Batch File List */
    .batch-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .batch-files-scroll {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 4px;
    }
    .batch-file-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.03);
      padding: 5px 8px;
      border-radius: 6px;
    }
    .batch-file-row-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      color: var(--text-main);
    }

    /* Batch Result List */
    .batch-result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }
    .batch-result-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .batch-res-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .batch-res-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .batch-res-size {
      font-size: 11px;
      color: #60a5fa;
      margin-top: 2px;
    }
    .batch-res-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-res-action {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
    }
    .btn-res-action:hover {
      background: rgba(59, 130, 246, 0.3);
      color: #ffffff;
    }
    .btn-batch-all {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-batch-all:active {
      transform: scale(0.98);
    }
  </style>
  <script src="lame.min.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>音声圧縮</h1>
      <p class="subtitle">100MB未満のMP3に最適化</p>
    </header>

    <!-- PWA Install Banner -->
    <div id="installBanner" style="display:none; background: linear-gradient(135deg, rgba(59,130,246,0.2) 0%, rgba(37,99,235,0.3) 100%); border: 1px solid rgba(59,130,246,0.4); border-radius: 14px; padding: 12px 14px; align-items: center; justify-content: space-between; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 20px;">📲</span>
        <div style="font-size: 13px; font-weight: 600; color: #93c5fd;">ホーム画面に追加</div>
      </div>
      <button onclick="promptInstallApp()" style="background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;">追加</button>
    </div>

    <div class="card">
      <!-- File Selector -->
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="drop-icon">🎙️</div>
        <div class="drop-title">ファイルを選択 または ドロップ</div>
      </div>
      <input type="file" id="fileInput" multiple accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.mp4,.mov">

      <!-- Selected File Info (Single) -->
      <div class="file-card" id="fileCard">
        <div class="file-name" id="fileName">lecture.m4a</div>
        <div class="file-meta">
          <div class="meta-item">時間: <span class="meta-val" id="fileDuration">--:--</span></div>
          <div class="meta-item">元サイズ: <span class="meta-val" id="fileSize">-- MB</span></div>
          <div class="meta-item">予想: <span class="meta-val" id="fileEst" style="color:#60a5fa;">約 -- MB</span></div>
        </div>
      </div>

      <!-- Selected Files Info (Batch) -->
      <div class="file-card" id="batchFileCard" style="display:none;">
        <div class="batch-summary">
          <span id="batchCountLabel">0件のファイル</span>
          <span id="batchTotalSizeLabel" style="color:#60a5fa; font-size:12px;">合計 0 MB</span>
        </div>
        <div class="batch-files-scroll" id="batchFilesScroll"></div>
      </div>
    </div>

    <!-- Settings Card -->
    <div class="card">
      <div class="settings-title">設定</div>
      <div class="pill-group">
        <div class="pill-btn active" data-mode="ai_voice" onclick="selectMode('ai_voice')">
          標準 (AI推奨)
        </div>
        <div class="pill-btn" data-mode="fit_target" onclick="selectMode('fit_target')">
          最高音質
        </div>
        <div class="pill-btn" data-mode="compact" onclick="selectMode('compact')">
          軽量
        </div>
        <div class="pill-btn" data-mode="custom" onclick="selectMode('custom')">
          カスタム
        </div>
      </div>

      <!-- Custom Target Size Panel (Visible only when 'custom' mode selected) -->
      <div id="customTargetBox" style="display:none; margin-bottom: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 10px 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 12px; font-weight: 600; color: var(--text-main);">目標サイズ (上限)</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="number" id="customTargetInput" min="5" max="500" value="50" oninput="updateEstimate()" style="width: 55px; background: #0f172a; border: 1px solid rgba(59,130,246,0.5); border-radius: 6px; color: #ffffff; text-align: center; font-weight: 700; font-size: 13px; padding: 4px 0;">
            <span style="font-size: 12px; font-weight: 600; color: #93c5fd;">MB</span>
          </div>
        </div>
        <div style="display: flex; gap: 6px;">
          <button type="button" class="btn-preset" onclick="setCustomTarget(25)">25MB</button>
          <button type="button" class="btn-preset" onclick="setCustomTarget(50)">50MB</button>
          <button type="button" class="btn-preset" onclick="setCustomTarget(100)">100MB</button>
        </div>
      </div>

      <div class="toggle-row">
        <span>モノラル化</span>
        <label class="toggle-switch">
          <input type="checkbox" id="monoToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Trimming Option (Single File Only) -->
      <div class="toggle-row" id="trimToggleRow" style="margin-top: 6px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08);">
        <span>✂️ トリミング</span>
        <label class="toggle-switch">
          <input type="checkbox" id="trimToggle" onchange="toggleTrimSection()">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Trimming Controls Panel -->
      <div class="trim-card" id="trimCard">
        <div class="trim-time-box">
          <div class="trim-col">
            <span class="trim-label">開始時間</span>
            <div class="trim-input-group">
              <input type="text" id="trimStartInput" class="trim-input" value="00:00:00" placeholder="00:00:00" onchange="onTrimInputChange()">
              <button type="button" class="btn-micro" onclick="setTrimStartToCurrent()">現位置</button>
            </div>
          </div>

          <div class="trim-col" style="align-items: center;">
            <span class="trim-label">範囲</span>
            <div class="trim-duration-badge" id="trimDurationBadge">--:--</div>
          </div>

          <div class="trim-col" style="align-items: flex-end;">
            <span class="trim-label">終了時間</span>
            <div class="trim-input-group">
              <button type="button" class="btn-micro" onclick="setTrimEndToCurrent()">現位置</button>
              <input type="text" id="trimEndInput" class="trim-input" value="00:00:00" placeholder="00:00:00" onchange="onTrimInputChange()">
            </div>
          </div>
        </div>

        <!-- Range Slider with dual thumbs -->
        <div class="range-slider-container">
          <div class="range-track"></div>
          <div class="range-highlight" id="rangeHighlight"></div>
          <input type="range" id="trimStartSlider" class="trim-slider" min="0" max="100" value="0" step="0.1" oninput="onTrimSliderInput('start')">
          <input type="range" id="trimEndSlider" class="trim-slider" min="0" max="100" value="100" step="0.1" oninput="onTrimSliderInput('end')">
        </div>

        <!-- Preview Audio Bar -->
        <div class="preview-bar">
          <button type="button" class="btn-preview" id="btnPreview" onclick="togglePreviewPlay()">
            <span id="previewPlayIcon">▶</span>
            <span id="previewPlayText">試聴</span>
          </button>
          <div style="font-size:11px; color:var(--text-sub); display:flex; align-items:center; gap:5px;">
            位置: <span id="previewCurrentTime" style="font-family:monospace; color:#ffffff; font-weight:600;">00:00:00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Execution Card -->
    <div class="card">
      <button class="btn-main" id="btnConvert" disabled onclick="startConversion()">
        圧縮開始
      </button>

      <!-- Progress -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="status-text">
          <div class="status-left">
            <span class="spinner" id="progressSpinner"></span>
            <span id="statusLabel">処理中...</span>
          </div>
          <span id="percentLabel">0%</span>
        </div>
      </div>

      <!-- Result (Single) -->
      <div class="result-container" id="resultContainer">
        <a class="btn-download" id="downloadBtn" download="lecture_compressed.mp3">
          📥 保存 (<span id="outSizeLabel">0 MB</span>)
        </a>
        <button class="btn-share" id="shareBtn" onclick="shareAudio()">
          📤 共有
        </button>
      </div>

      <!-- Result (Batch) -->
      <div id="batchResultContainer" style="display:none; margin-top:12px;">
        <button type="button" class="btn-batch-all" id="btnDownloadAll" onclick="downloadAllBatch()">
          📥 全ファイルを一括保存 (<span id="batchTotalSavedLabel">0件</span>)
        </button>
        <div class="batch-result-list" id="batchResultList"></div>
      </div>
    </div>

    <div class="privacy-notice">
      🔒 完全端末内処理 (オフライン動作)
    </div>
  </div>

  <script>
    let selectedFile = null;
    let selectedFiles = [];
    let audioDuration = 0;
    let selectedMode = 'ai_voice';
    let convertedBlob = null;
    let convertedFileName = '';
    let convertedResults = [];
    let lameJsSource = '';

    // Preload lamejs source for Web Worker
    fetch('lame.min.js')
      .then(r => r.text())
      .then(t => { lameJsSource = t; })
      .catch(err => console.warn('Worker script preload failed, fallback to main thread:', err));

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileCard = document.getElementById('fileCard');
    const batchFileCard = document.getElementById('batchFileCard');
    const batchCountLabel = document.getElementById('batchCountLabel');
    const batchTotalSizeLabel = document.getElementById('batchTotalSizeLabel');
    const batchFilesScroll = document.getElementById('batchFilesScroll');
    const fileName = document.getElementById('fileName');
    const fileDuration = document.getElementById('fileDuration');
    const fileSize = document.getElementById('fileSize');
    const fileEst = document.getElementById('fileEst');
    const btnConvert = document.getElementById('btnConvert');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressSpinner = document.getElementById('progressSpinner');
    const statusLabel = document.getElementById('statusLabel');
    const percentLabel = document.getElementById('percentLabel');
    const resultContainer = document.getElementById('resultContainer');
    const batchResultContainer = document.getElementById('batchResultContainer');
    const batchResultList = document.getElementById('batchResultList');
    const batchTotalSavedLabel = document.getElementById('batchTotalSavedLabel');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const outSizeLabel = document.getElementById('outSizeLabel');
    const trimToggleRow = document.getElementById('trimToggleRow');

    // Trimming elements
    const trimToggle = document.getElementById('trimToggle');
    const trimCard = document.getElementById('trimCard');
    const trimStartInput = document.getElementById('trimStartInput');
    const trimEndInput = document.getElementById('trimEndInput');
    const trimDurationBadge = document.getElementById('trimDurationBadge');
    const trimStartSlider = document.getElementById('trimStartSlider');
    const trimEndSlider = document.getElementById('trimEndSlider');
    const rangeHighlight = document.getElementById('rangeHighlight');
    const btnPreview = document.getElementById('btnPreview');
    const previewPlayIcon = document.getElementById('previewPlayIcon');
    const previewPlayText = document.getElementById('previewPlayText');
    const previewCurrentTime = document.getElementById('previewCurrentTime');

    let trimStartTime = 0;
    let trimEndTime = 0;
    let previewAudio = new Audio();
    let isPreviewPlaying = false;
    let selectedFileBlobUrl = null;

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFilesSelect(e.target.files);
      }
    });

    // Drag & drop support
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'rgba(255, 255, 255, 0.18)'; });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'rgba(255, 255, 255, 0.18)';
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFilesSelect(e.dataTransfer.files);
      }
    });

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      const h = Math.floor(m / 60);
      if (h > 0) {
        return `${h}:${String(m % 60).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatFullTime(sec) {
      if (!sec || isNaN(sec) || sec < 0) sec = 0;
      const totalSec = Math.floor(sec);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function parseTimeString(str) {
      if (!str) return 0;
      const parts = str.trim().split(':').map(p => parseFloat(p) || 0);
      if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      } else if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
      } else if (parts.length === 1) {
        return parts[0];
      }
      return 0;
    }

    function toggleTrimSection() {
      const isChecked = trimToggle.checked;
      trimCard.style.display = isChecked ? 'block' : 'none';
      if (isChecked) {
        if (trimEndTime === 0 && audioDuration > 0) {
          trimEndTime = audioDuration;
        }
        updateTrimUI();
      } else {
        pausePreview();
      }
      updateEstimate();
    }

    function updateTrimUI() {
      if (!audioDuration || audioDuration <= 0) return;
      trimStartTime = Math.max(0, Math.min(trimStartTime, audioDuration));
      trimEndTime = Math.max(trimStartTime, Math.min(trimEndTime, audioDuration));

      trimStartInput.value = formatFullTime(trimStartTime);
      trimEndInput.value = formatFullTime(trimEndTime);

      const trimLen = Math.max(0, trimEndTime - trimStartTime);
      trimDurationBadge.textContent = formatTime(trimLen);

      const startPct = (trimStartTime / audioDuration) * 100;
      const endPct = (trimEndTime / audioDuration) * 100;

      trimStartSlider.value = startPct;
      trimEndSlider.value = endPct;

      rangeHighlight.style.left = startPct + '%';
      rangeHighlight.style.width = Math.max(0, endPct - startPct) + '%';
    }

    function onTrimSliderInput(type) {
      if (!audioDuration || audioDuration <= 0) return;
      let startVal = parseFloat(trimStartSlider.value);
      let endVal = parseFloat(trimEndSlider.value);

      if (type === 'start') {
        if (startVal > endVal) {
          startVal = endVal;
          trimStartSlider.value = startVal;
        }
      } else {
        if (endVal < startVal) {
          endVal = startVal;
          trimEndSlider.value = endVal;
        }
      }

      trimStartTime = (startVal / 100) * audioDuration;
      trimEndTime = (endVal / 100) * audioDuration;

      trimStartInput.value = formatFullTime(trimStartTime);
      trimEndInput.value = formatFullTime(trimEndTime);
      const trimLen = Math.max(0, trimEndTime - trimStartTime);
      trimDurationBadge.textContent = formatTime(trimLen);

      rangeHighlight.style.left = startVal + '%';
      rangeHighlight.style.width = Math.max(0, endVal - startVal) + '%';

      if (isPreviewPlaying) {
        previewAudio.currentTime = trimStartTime;
      }

      updateEstimate();
    }

    function onTrimInputChange() {
      if (!audioDuration || audioDuration <= 0) return;
      let start = parseTimeString(trimStartInput.value);
      let end = parseTimeString(trimEndInput.value);

      if (end <= start) {
        end = Math.min(audioDuration, start + 30);
      }
      trimStartTime = Math.max(0, Math.min(start, audioDuration));
      trimEndTime = Math.max(trimStartTime, Math.min(end, audioDuration));

      updateTrimUI();
      updateEstimate();
    }

    function setTrimStartToCurrent() {
      if (!previewAudio || isNaN(previewAudio.currentTime)) return;
      trimStartTime = previewAudio.currentTime;
      if (trimEndTime < trimStartTime) trimEndTime = audioDuration;
      updateTrimUI();
      updateEstimate();
    }

    function setTrimEndToCurrent() {
      if (!previewAudio || isNaN(previewAudio.currentTime)) return;
      trimEndTime = previewAudio.currentTime;
      if (trimStartTime > trimEndTime) trimStartTime = 0;
      updateTrimUI();
      updateEstimate();
    }

    function togglePreviewPlay() {
      if (!selectedFileBlobUrl) return;

      if (isPreviewPlaying) {
        pausePreview();
      } else {
        startPreview();
      }
    }

    function startPreview() {
      if (!selectedFileBlobUrl) return;
      if (previewAudio.src !== selectedFileBlobUrl) {
        previewAudio.src = selectedFileBlobUrl;
      }

      if (previewAudio.currentTime < trimStartTime || previewAudio.currentTime >= trimEndTime) {
        previewAudio.currentTime = trimStartTime;
      }

      previewAudio.play().then(() => {
        isPreviewPlaying = true;
        previewPlayIcon.textContent = '⏸';
        previewPlayText.textContent = '一時停止';
      }).catch(err => {
        console.warn('Preview playback failed:', err);
      });
    }

    function pausePreview() {
      previewAudio.pause();
      isPreviewPlaying = false;
      previewPlayIcon.textContent = '▶';
      previewPlayText.textContent = '選択区間を試聴';
    }

    previewAudio.addEventListener('timeupdate', () => {
      previewCurrentTime.textContent = formatFullTime(previewAudio.currentTime);
      if (isPreviewPlaying && trimToggle && trimToggle.checked) {
        if (previewAudio.currentTime >= trimEndTime) {
          pausePreview();
          previewAudio.currentTime = trimStartTime;
        }
      }
    });

    previewAudio.addEventListener('ended', () => {
      pausePreview();
    });

    function formatBytes(bytes) {
      if (bytes >= 1024 * 1024 * 1024) return (bytes / (1024 ** 3)).toFixed(1) + " GB";
      if (bytes >= 1024 * 1024) return (bytes / (1024 ** 2)).toFixed(1) + " MB";
      return (bytes / 1024).toFixed(0) + " KB";
    }

    function getCustomTargetMb() {
      const input = document.getElementById('customTargetInput');
      const val = parseFloat(input ? input.value : 50);
      return (!isNaN(val) && val > 0) ? val : 50;
    }

    function setCustomTarget(mb) {
      const input = document.getElementById('customTargetInput');
      if (input) {
        input.value = mb;
        updateEstimate();
      }
    }

    function calculateBitrate(dur, mode, customTargetMb = 50) {
      if (!dur || dur <= 0) return 64;

      if (mode === 'custom') {
        const targetMb = Math.max(5, Math.min(customTargetMb, 500));
        const maxSafeBytes = targetMb * 1024 * 1024 * 0.94;
        const targetKbps = Math.floor((maxSafeBytes * 8) / (dur * 1000));
        return Math.min(320, Math.max(16, targetKbps));
      }

      // Target max bytes = 95MB to strictly guarantee < 100MB
      const maxSafeBytes = 95 * 1024 * 1024 * 0.94;
      const maxAllowedKbps = Math.floor((maxSafeBytes * 8) / (dur * 1000));

      if (mode === 'ai_voice') {
        return maxAllowedKbps < 64 ? Math.max(24, maxAllowedKbps) : 64;
      } else if (mode === 'fit_target') {
        return Math.min(192, Math.max(32, maxAllowedKbps));
      } else if (mode === 'compact') {
        return Math.min(32, Math.max(24, maxAllowedKbps));
      }
      return 64;
    }

    function getEffectiveDuration() {
      if (trimToggle && trimToggle.checked && trimEndTime > trimStartTime) {
        return trimEndTime - trimStartTime;
      }
      return audioDuration || 5400;
    }

    function updateEstimate() {
      if (!selectedFile) return;
      const effDur = getEffectiveDuration();
      const customMb = getCustomTargetMb();
      const kbps = calculateBitrate(effDur, selectedMode, customMb);
      const estBytes = (kbps * 1000 / 8) * effDur;
      const trimNotice = (trimToggle && trimToggle.checked && trimEndTime > trimStartTime) ? ' (区間抽出)' : '';
      fileEst.textContent = `約 ${(estBytes / (1024 * 1024)).toFixed(1)} MB (${kbps}kbps)${trimNotice}`;
    }

    function selectMode(mode) {
      selectedMode = mode;
      document.querySelectorAll('.pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      const customBox = document.getElementById('customTargetBox');
      if (customBox) {
        customBox.style.display = (mode === 'custom') ? 'block' : 'none';
      }
      updateEstimate();
    }

    function handleFilesSelect(filesList) {
      selectedFiles = Array.from(filesList);
      if (selectedFiles.length === 0) return;

      convertedResults = [];
      resultContainer.style.display = 'none';
      batchResultContainer.style.display = 'none';
      batchResultList.innerHTML = '';
      progressContainer.style.display = 'none';
      pausePreview();

      if (selectedFiles.length === 1) {
        selectedFile = selectedFiles[0];
        batchFileCard.style.display = 'none';
        fileCard.style.display = 'block';
        if (trimToggleRow) trimToggleRow.style.display = 'flex';
        btnConvert.textContent = '圧縮開始';
        btnConvert.disabled = false;

        fileName.textContent = selectedFile.name;
        fileSize.textContent = formatBytes(selectedFile.size);

        if (selectedFileBlobUrl) {
          URL.revokeObjectURL(selectedFileBlobUrl);
        }
        selectedFileBlobUrl = URL.createObjectURL(selectedFile);
        previewAudio.src = selectedFileBlobUrl;

        audioDuration = 0;
        fileDuration.textContent = '解析中...';

        const tempAudio = new Audio();
        tempAudio.src = selectedFileBlobUrl;

        tempAudio.addEventListener('loadedmetadata', () => {
          audioDuration = tempAudio.duration;
          fileDuration.textContent = formatTime(audioDuration);
          trimStartTime = 0;
          trimEndTime = audioDuration;
          updateTrimUI();
          updateEstimate();
        });

        tempAudio.addEventListener('error', () => {
          audioDuration = 90 * 60;
          fileDuration.textContent = '約90分(推定)';
          trimStartTime = 0;
          trimEndTime = audioDuration;
          updateTrimUI();
          updateEstimate();
        });
      } else {
        selectedFile = selectedFiles[0]; // fallback
        fileCard.style.display = 'none';
        batchFileCard.style.display = 'block';
        if (trimToggleRow) trimToggleRow.style.display = 'none';
        if (trimToggle) trimToggle.checked = false;
        toggleTrimSection();

        const totalBytes = selectedFiles.reduce((acc, f) => acc + f.size, 0);
        batchCountLabel.textContent = `${selectedFiles.length}件のファイル選択中`;
        batchTotalSizeLabel.textContent = `合計 ${formatBytes(totalBytes)}`;

        batchFilesScroll.innerHTML = selectedFiles.map(f => `
          <div class="batch-file-row">
            <span class="batch-file-row-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
            <span>${formatBytes(f.size)}</span>
          </div>
        `).join('');

        btnConvert.textContent = `一括圧縮開始 (${selectedFiles.length}件)`;
        btnConvert.disabled = false;
      }
    }

    async function encodeSingleAudioFile(file, options, onProgress) {
      onProgress(2, 'ファイルを読み込み中...');

      // 1. Read file into ArrayBuffer
      const fileBuffer = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onprogress = (e) => {
          if (e.lengthComputable && e.total > 0) {
            const p = Math.min(10, Math.floor((e.loaded / e.total) * 10));
            onProgress(p, 'ファイルを読み込み中...');
          }
        };
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
      });
      onProgress(10, '音声波形を展開中...');

      // 2. Decode Audio
      const targetSampleRate = 16000;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      let tempAudioCtx = null;
      try {
        tempAudioCtx = new AudioContextClass({ sampleRate: targetSampleRate });
      } catch (e) {
        tempAudioCtx = new AudioContextClass();
      }

      const decodedAudio = await new Promise((resolve, reject) => {
        const buf = fileBuffer.slice(0);
        let resolved = false;
        const onSuccess = (result) => {
          if (!resolved) {
            resolved = true;
            resolve(result);
          }
        };
        const onError = (err) => {
          if (!resolved) {
            resolved = true;
            reject(err || new Error('音声データの展開に失敗しました。'));
          }
        };
        try {
          const p = tempAudioCtx.decodeAudioData(buf, onSuccess, onError);
          if (p && typeof p.then === 'function') {
            p.then(onSuccess).catch(onError);
          }
        } catch (syncErr) {
          onError(syncErr);
        }
      });

      try { tempAudioCtx.close(); } catch(e){}

      onProgress(16, '16kHzモノラルに最適化中...');

      const origDuration = decodedAudio.duration;
      let monoData = null;

      if (decodedAudio.sampleRate === targetSampleRate && decodedAudio.numberOfChannels === 1) {
        monoData = decodedAudio.getChannelData(0);
      } else if (decodedAudio.sampleRate === targetSampleRate) {
        const len = decodedAudio.length;
        monoData = new Float32Array(len);
        const numCh = decodedAudio.numberOfChannels;
        for (let ch = 0; ch < numCh; ch++) {
          const chData = decodedAudio.getChannelData(ch);
          for (let i = 0; i < len; i++) {
            monoData[i] += chData[i] / numCh;
          }
        }
      } else {
        const targetLength = Math.ceil(origDuration * targetSampleRate);
        const OfflineContextClass = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        const offlineCtx = new OfflineContextClass(1, targetLength, targetSampleRate);
        const source = offlineCtx.createBufferSource();
        source.buffer = decodedAudio;
        source.connect(offlineCtx.destination);
        source.start(0);

        const resampledAudio = await offlineCtx.startRendering();
        monoData = resampledAudio.getChannelData(0);
      }

      // Check trimming
      let finalDuration = origDuration;
      if (options.trimActive && options.trimEnd > options.trimStart) {
        const startSec = Math.max(0, Math.min(options.trimStart, origDuration));
        const endSec = Math.min(origDuration, Math.max(startSec + 0.1, options.trimEnd));
        finalDuration = endSec - startSec;

        const startSample = Math.floor(startSec * targetSampleRate);
        const endSample = Math.min(monoData.length, Math.ceil(endSec * targetSampleRate));
        monoData = monoData.subarray(startSample, endSample);
      }

      // 4. Parallel MP3 Encoding
      const kbps = calculateBitrate(finalDuration, options.selectedMode, options.customTargetMb);
      const cores = navigator.hardwareConcurrency || 4;
      const numWorkers = Math.max(1, Math.min(cores, 6));

      onProgress(20, `MP3(${kbps}kbps, ${numWorkers}並列)に圧縮中...`);

      return new Promise((resolve, reject) => {
        let workerSuccess = false;

        if (window.Worker && lameJsSource) {
          try {
            const frameSize = 1152;
            const totalSamples = monoData.length;
            const totalFrames = Math.ceil(totalSamples / frameSize);
            const framesPerWorker = Math.ceil(totalFrames / numWorkers);

            const workerScript = `
              ${lameJsSource}
              self.onmessage = function(e) {
                const { workerIndex, monoBuffer, sampleRate, kbps } = e.data;
                const monoData = new Float32Array(monoBuffer);
                const totalSamples = monoData.length;
                const mp3Encoder = new lamejs.Mp3Encoder(1, sampleRate, kbps);
                const mp3Data = [];

                const chunkSize = 1152 * 32;
                const int16Chunk = new Int16Array(chunkSize);
                let offset = 0;
                let lastReportTime = Date.now();

                while (offset < totalSamples) {
                  const end = Math.min(offset + chunkSize, totalSamples);
                  const count = end - offset;

                  for (let i = 0; i < count; i++) {
                    let s = monoData[offset + i];
                    if (s > 1) s = 1;
                    else if (s < -1) s = -1;
                    int16Chunk[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                  }

                  const chunkToEncode = (count === chunkSize) ? int16Chunk : int16Chunk.subarray(0, count);
                  const mp3buf = mp3Encoder.encodeBuffer(chunkToEncode);
                  if (mp3buf.length > 0) mp3Data.push(mp3buf);
                  offset = end;

                  const now = Date.now();
                  if (now - lastReportTime > 120 || offset === totalSamples) {
                    self.postMessage({ type: 'progress', workerIndex: workerIndex, processed: offset });
                    lastReportTime = now;
                  }
                }

                const finalBuf = mp3Encoder.flush();
                if (finalBuf.length > 0) mp3Data.push(finalBuf);
                self.postMessage({ type: 'complete', workerIndex: workerIndex, mp3Data: mp3Data });
              };
            `;

            const workerBlob = new Blob([workerScript], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(workerBlob);

            const workerResults = new Array(numWorkers);
            let completedWorkers = 0;
            const processedPerWorker = new Array(numWorkers).fill(0);
            const workers = [];

            for (let w = 0; w < numWorkers; w++) {
              const startSample = w * framesPerWorker * frameSize;
              const endSample = Math.min((w + 1) * framesPerWorker * frameSize, totalSamples);
              const chunkData = monoData.subarray(startSample, endSample);

              const worker = new Worker(workerUrl);
              workers.push(worker);
              const transferBuffer = chunkData.slice().buffer;

              worker.onmessage = function(ev) {
                if (ev.data.type === 'progress') {
                  processedPerWorker[ev.data.workerIndex] = ev.data.processed;
                  const totalDone = processedPerWorker.reduce((a, b) => a + b, 0);
                  const pct = Math.floor(20 + (totalDone / totalSamples) * 78);
                  onProgress(pct, `MP3(${kbps}kbps)に圧縮中...`);
                } else if (ev.data.type === 'complete') {
                  workerResults[ev.data.workerIndex] = ev.data.mp3Data;
                  completedWorkers++;

                  if (completedWorkers === numWorkers) {
                    workers.forEach(wk => wk.terminate());
                    URL.revokeObjectURL(workerUrl);

                    const mergedMp3 = [];
                    for (let i = 0; i < numWorkers; i++) {
                      if (workerResults[i]) {
                        for (const buf of workerResults[i]) {
                          mergedMp3.push(buf);
                        }
                      }
                    }
                    finishEncoding(mergedMp3);
                  }
                }
              };

              worker.onerror = function(err) {
                console.warn('Worker error, fallback to main thread:', err);
                workers.forEach(wk => wk.terminate());
                URL.revokeObjectURL(workerUrl);
                fallbackMainThread();
              };

              worker.postMessage({
                workerIndex: w,
                monoBuffer: transferBuffer,
                sampleRate: targetSampleRate,
                kbps: kbps
              }, [transferBuffer]);
            }

            workerSuccess = true;
          } catch (wErr) {
            console.warn('Worker init failed, fallback:', wErr);
          }
        }

        if (!workerSuccess) {
          fallbackMainThread();
        }

        function fallbackMainThread() {
          const mp3Encoder = new lamejs.Mp3Encoder(1, targetSampleRate, kbps);
          const mp3Data = [];
          const chunkSize = 1152 * 32;
          const int16Chunk = new Int16Array(chunkSize);
          const totalSamples = monoData.length;
          let offset = 0;

          function encodeTimeSlice() {
            const sliceStart = performance.now();
            while (offset < totalSamples && (performance.now() - sliceStart < 25)) {
              const end = Math.min(offset + chunkSize, totalSamples);
              const count = end - offset;

              for (let i = 0; i < count; i++) {
                let s = monoData[offset + i];
                if (s > 1) s = 1;
                else if (s < -1) s = -1;
                int16Chunk[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
              }

              const chunkToEncode = (count === chunkSize) ? int16Chunk : int16Chunk.subarray(0, count);
              const mp3buf = mp3Encoder.encodeBuffer(chunkToEncode);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
              offset = end;
            }

            const pct = Math.floor(20 + (offset / totalSamples) * 78);
            onProgress(pct, `MP3(${kbps}kbps)に圧縮中...`);

            if (offset < totalSamples) {
              setTimeout(encodeTimeSlice, 0);
            } else {
              const finalBuf = mp3Encoder.flush();
              if (finalBuf.length > 0) mp3Data.push(finalBuf);
              finishEncoding(mp3Data);
            }
          }

          encodeTimeSlice();
        }

        function finishEncoding(mp3Data) {
          const blob = new Blob(mp3Data, { type: 'audio/mp3' });
          const origBase = file.name.replace(/\.[^/.]+$/, "");
          const outFileName = options.trimActive ? `${origBase}_trimmed.mp3` : `${origBase}_compressed.mp3`;
          const url = URL.createObjectURL(blob);
          resolve({
            file: file,
            blob: blob,
            fileName: outFileName,
            size: blob.size,
            url: url
          });
        }
      });
    }

    async function startConversion() {
      if (!selectedFiles || selectedFiles.length === 0) return;

      pausePreview();
      btnConvert.disabled = true;
      progressContainer.style.display = 'block';
      resultContainer.style.display = 'none';
      batchResultContainer.style.display = 'none';
      batchResultList.innerHTML = '';
      convertedResults = [];

      progressBar.style.backgroundColor = '#3b82f6';
      progressBar.style.width = '0%';
      progressSpinner.style.display = 'inline-block';
      statusLabel.textContent = '初期化中...';
      percentLabel.textContent = '0%';

      try {
        if (!lameJsSource) {
          try {
            lameJsSource = await (await fetch('lame.min.js')).text();
          } catch (e) {
            console.warn('Failed to load lame.min.js:', e);
          }
        }

        const totalFiles = selectedFiles.length;
        const isSingle = (totalFiles === 1);

        const options = {
          selectedMode: selectedMode,
          customTargetMb: getCustomTargetMb(),
          isMono: monoToggle.checked,
          trimActive: isSingle && trimToggle && trimToggle.checked && (trimEndTime > trimStartTime),
          trimStart: trimStartTime,
          trimEnd: trimEndTime
        };

        for (let i = 0; i < totalFiles; i++) {
          const file = selectedFiles[i];
          const fileIndex = i;

          const res = await encodeSingleAudioFile(file, options, (filePct, label) => {
            const overallPct = Math.floor((fileIndex / totalFiles) * 100 + (filePct / totalFiles));
            progressBar.style.width = overallPct + '%';
            percentLabel.textContent = overallPct + '%';
            if (totalFiles > 1) {
              statusLabel.textContent = `[${fileIndex + 1}/${totalFiles}] ${label}`;
            } else {
              statusLabel.textContent = label;
            }
          });

          convertedResults.push(res);

          if (!isSingle) {
            addBatchResultItem(res, fileIndex);
            batchResultContainer.style.display = 'block';
            batchTotalSavedLabel.textContent = `${convertedResults.length}件`;
          }
        }

        // All done
        progressBar.style.width = '100%';
        percentLabel.textContent = '100%';
        progressSpinner.style.display = 'none';
        statusLabel.textContent = isSingle ? (options.trimActive ? '区間切り出し完了！' : '変換完了！') : `全${totalFiles}件の圧縮が完了しました`;
        btnConvert.disabled = false;

        if (isSingle) {
          const singleRes = convertedResults[0];
          downloadBtn.href = singleRes.url;
          downloadBtn.download = singleRes.fileName;
          outSizeLabel.textContent = formatBytes(singleRes.size);
          resultContainer.style.display = 'flex';
          convertedBlob = singleRes.blob;
          convertedFileName = singleRes.fileName;
        }

        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

      } catch (err) {
        console.error(err);
        if (progressSpinner) progressSpinner.style.display = 'none';
        statusLabel.textContent = 'エラーが発生しました: ' + err.message;
        progressBar.style.backgroundColor = '#ef4444';
        btnConvert.disabled = false;
        alert('変換中にエラーが発生しました: ' + err.message);
      }
    }

    function addBatchResultItem(res, index) {
      const item = document.createElement('div');
      item.className = 'batch-result-item';
      item.innerHTML = `
        <div class="batch-res-info">
          <span class="batch-res-name" title="${escapeHtml(res.fileName)}">${escapeHtml(res.fileName)}</span>
          <span class="batch-res-size">${formatBytes(res.size)}</span>
        </div>
        <div class="batch-res-actions">
          <a class="btn-res-action" href="${res.url}" download="${escapeHtml(res.fileName)}">📥 保存</a>
          <button type="button" class="btn-res-action" onclick="shareBatchItem(${index})">📤 共有</button>
        </div>
      `;
      batchResultList.appendChild(item);
    }

    function downloadAllBatch() {
      if (!convertedResults || convertedResults.length === 0) return;
      convertedResults.forEach((item, idx) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = item.url;
          a.download = item.fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, idx * 250);
      });
    }

    async function shareBatchItem(index) {
      const item = convertedResults[index];
      if (!item) return;

      if (navigator.canShare && navigator.canShare({ files: [new File([item.blob], item.fileName, { type: 'audio/mp3' })] })) {
        try {
          const fileToShare = new File([item.blob], item.fileName, { type: 'audio/mp3' });
          await navigator.share({
            title: item.fileName,
            text: 'AI向けに100MB未満に圧縮した音声',
            files: [fileToShare]
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            alert('共有できませんでした。保存ボタンをご利用ください。');
          }
        }
      } else {
        alert('お使いの環境は直接共有に対応していません。「保存」ボタンからダウンロードしてください。');
      }
    }

    async function shareAudio() {
      if (convertedResults.length === 0) return;
      shareBatchItem(0);
    }

    // Register Service Worker for PWA installation (with auto-update check)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          reg.update().catch(() => {});
        }).catch(console.error);
      });
    }

    // PWA Install prompt handling
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('installBanner');
      if (banner) banner.style.display = 'flex';
    });

    async function promptInstallApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          const banner = document.getElementById('installBanner');
          if (banner) banner.style.display = 'none';
        }
        deferredPrompt = null;
      }
    }
  </script>
</body>
